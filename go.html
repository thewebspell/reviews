<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>Opening Google</title>
<!--
  Cloudflare Web Analytics beacon goes here. This page has no config loader,
  so the token is pasted by hand. Copy analytics.cloudflareToken from
  clients/<slug>.json, put it in place of PASTE_TOKEN_HERE, then remove the
  comment markers around the script line below so the beacon loads.
  Cloudflare counts the full URL, so the ?c= slug shows up as the label.

  <script defer src="https://static.cloudflareinsights.com/beacon.min.js"
    data-cf-beacon='{"token": "PASTE_TOKEN_HERE"}'></script>
-->
<style>
  body { min-height: 100vh; margin: 0; box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; color: #2a1620; background: #fff; text-align: center; }
  p { margin: 0 0 8px; font-size: 18px; line-height: 1.5; }
  .small { font-size: 15px; color: #555; }
  a { display: inline-block; min-height: 44px; line-height: 44px; padding: 0 20px;
    margin-top: 12px; border-radius: 8px; background: #8a2d4d; color: #fff;
    text-decoration: none; font-size: 16px; }
</style>
</head>
<body>
<main>
  <div id="wait">
    <p lang="hi">गूगल खुल रहा है</p>
    <p lang="en" class="small">Opening Google</p>
  </div>
  <div id="stop" hidden>
    <p lang="hi">यह लिंक सही नहीं है।</p>
    <p lang="en" class="small">This link is not correct, so Google was not opened.</p>
    <a href="./">Back to the review page</a>
  </div>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var placeId = q.get('p') || '';
  var slug = q.get('c') || '';
  // The slug is only an analytics label. It is never used to build the redirect.
  if (/^[a-z0-9-]{1,40}$/.test(slug)) { document.body.setAttribute('data-client', slug); }
  // Strict allowlist. Anything else is refused, so this cannot become an open redirect.
  if (/^[A-Za-z0-9_-]{20,80}$/.test(placeId)) {
    location.replace('https://search.google.com/local/writereview?placeid=' + encodeURIComponent(placeId));
  } else {
    document.getElementById('wait').hidden = true;
    document.getElementById('stop').hidden = false;
  }
})();
</script>
</body>
</html>
